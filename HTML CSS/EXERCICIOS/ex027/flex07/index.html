<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex07</title>
    <style>
        div.container {
            background-color: lightsalmon;
            display: flex;
            flex-flow: row nowrap;
        }
        div.item {
            background-color: lightskyblue;
            border: 1px solid black;
            padding: 20px;
            text-align: center;
        
        }
        div#i1 {
            order: 3;
        }
         div#i2 {
            order: 1;
        }
         div#i3 {
            order: 0;
        }
         div#i4{
            order: 1;
        }
         div#i5 {
            order: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item" id="i1">A</div>
        <div class="item" id="i2">B</div>
        <div class="item" id="13">C</div>
        <div class="item" id="i4">D</div>
        <div class="item" id="15">E</div>
    </div>
</body>
</html>
